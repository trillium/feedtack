<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedtack</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        background: #0f172a;
        color: #f1f5f9;
        width: 280px;
        padding: 16px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 15px;
        font-weight: 600;
        color: #f8fafc;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #94a3b8;
        cursor: pointer;
      }

      .toggle input[type="checkbox"] {
        width: 32px;
        height: 18px;
        appearance: none;
        background: #334155;
        border-radius: 9px;
        position: relative;
        cursor: pointer;
        transition: background 0.2s;
      }

      .toggle input[type="checkbox"]:checked {
        background: #3b82f6;
      }

      .toggle input[type="checkbox"]::after {
        content: '';
        position: absolute;
        width: 14px;
        height: 14px;
        background: white;
        border-radius: 50%;
        top: 2px;
        left: 2px;
        transition: left 0.2s;
      }

      .toggle input[type="checkbox"]:checked::after {
        left: 16px;
      }

      .field {
        margin-bottom: 12px;
      }

      label {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: #94a3b8;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      input[type="text"],
      input[type="email"],
      input[type="url"] {
        width: 100%;
        padding: 7px 10px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 6px;
        color: #f1f5f9;
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
      }

      input:focus {
        border-color: #3b82f6;
      }

      input::placeholder {
        color: #475569;
      }

      .hint {
        font-size: 11px;
        color: #475569;
        margin-top: 3px;
      }

      button {
        width: 100%;
        padding: 8px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 4px;
        transition: background 0.15s;
      }

      button:hover { background: #2563eb; }

      .saved {
        display: none;
        text-align: center;
        color: #22c55e;
        font-size: 12px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Feedtack</h1>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked />
        On
      </label>
    </header>

    <div class="field">
      <label for="webhookUrl">Webhook URL</label>
      <input type="url" id="webhookUrl" placeholder="http://localhost:2727/tack" />
      <p class="hint">Where tacks are sent. Leave blank for clipboard mode.</p>
    </div>

    <div class="field">
      <label for="userName">Your Name</label>
      <input type="text" id="userName" placeholder="Anonymous" />
    </div>

    <div class="field">
      <label for="userEmail">Your Email</label>
      <input type="email" id="userEmail" placeholder="you@example.com" />
    </div>

    <button id="save">Save</button>
    <div class="saved" id="saved">Saved ✓</div>

    <script src="popup.js"></script>
  </body>
</html>
